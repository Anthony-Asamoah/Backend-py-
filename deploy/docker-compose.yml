
services:
  db:
    image: postgres:15-alpine
    container_name: fastdjango_db_dev
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    expose:
      - "${DB_PORT:-5432}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastdjango_web_dev
    expose:
      - ${APP_PORT:-80}
    env_file:
      - .env
    environment:
      DB_HOST: db  # Override for Docker networking
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - media_data_dev:/app/media

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastdjango-dev.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.fastdjango-dev.entrypoints=web"
      - "traefik.http.services.fastdjango-dev.loadbalancer.server.port=${APP_PORT:-80}"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fastdjango_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fastdjango.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - tools

  traefik:
    image: traefik:latest
    ports:
      - "80:80"
      - "8080:8080"
      - "5050:5050"
    volumes:
      - "./traefik.dev.toml:/etc/traefik/traefik.toml"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"


volumes:
  postgres_data_dev:
  media_data_dev:
  pgadmin_data_dev: